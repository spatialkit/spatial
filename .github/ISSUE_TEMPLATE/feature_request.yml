name: Feature request
description: Suggest a new feature or an improvement.
labels: [enhancement]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - '@spatialkit/core'
        - '@spatialkit/svg'
        - '@spatialkit/react'
        - New package
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to build, and what is missing or hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could the API look? Code sketches are welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Anything you tried or considered.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this.
