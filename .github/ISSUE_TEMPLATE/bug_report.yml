name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Security issues must be reported privately; see SECURITY.md.
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - '@spatial-kit/core'
        - '@spatial-kit/svg'
        - '@spatial-kit/react'
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: '0.2.0'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code or a link to a repository or sandbox that reproduces the problem.
      render: ts
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser and version, OS, framework version (React, bundler) if relevant.
      placeholder: |
        Browser: Chrome 140
        OS: macOS 15
        React: 19.1
