name: Deploy Examples

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-examples
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build vanilla example
        run: pnpm -C packages/examples/js-vanilla run build

      - name: Build react example
        run: pnpm -C packages/examples/react run build

      - name: Assemble pages
        run: |
          mkdir -p pages/vanilla pages/react
          cp -r packages/examples/js-vanilla/dist/. pages/vanilla/
          cp -r packages/examples/react/dist/. pages/react/
          cat > pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <title>Spatial — Examples</title>
            <style>
              body { font-family: sans-serif; max-width: 480px; margin: 80px auto; padding: 0 24px; }
              h1 { font-size: 1.5rem; margin-bottom: 8px; }
              p  { color: #555; margin-bottom: 32px; }
              a  { display: block; padding: 14px 20px; border: 1px solid #e5e7eb;
                   border-radius: 8px; text-decoration: none; color: #111;
                   margin-bottom: 12px; }
              a:hover { background: #f9fafb; }
              a span { display: block; font-size: 0.85rem; color: #888; margin-top: 2px; }
            </style>
          </head>
          <body>
            <h1>Spatial</h1>
            <p>Interactive 2D editor toolkit — live examples</p>
            <a href="vanilla/">
              Vanilla JS
              <span>@spatial-kit/core + @spatial-kit/svg</span>
            </a>
            <a href="react/">
              React
              <span>@spatial-kit/core + @spatial-kit/react</span>
            </a>
          </body>
          </html>
          EOF

      - name: Deploy to Cloudflare
        id: deploy
        run: |
          OUTPUT=$(pnpm dlx wrangler@4.145.0 deploy --assets=./pages 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
