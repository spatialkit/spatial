name: Deploy Examples

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build vanilla example
        run: pnpm -C packages/examples/js-vanilla run build

      - name: Build react example
        run: pnpm -C packages/examples/react run build

      - name: Assemble pages
        run: |
          mkdir -p pages/vanilla pages/react
          cp -r packages/examples/js-vanilla/dist/. pages/vanilla/
          cp -r packages/examples/react/dist/. pages/react/
          cat > pages/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <title>Spatial — Examples</title>
            <style>
              body { font-family: sans-serif; max-width: 480px; margin: 80px auto; padding: 0 24px; }
              h1 { font-size: 1.5rem; margin-bottom: 8px; }
              p  { color: #555; margin-bottom: 32px; }
              a  { display: block; padding: 14px 20px; border: 1px solid #e5e7eb;
                   border-radius: 8px; text-decoration: none; color: #111;
                   margin-bottom: 12px; }
              a:hover { background: #f9fafb; }
              a span { display: block; font-size: 0.85rem; color: #888; margin-top: 2px; }
            </style>
          </head>
          <body>
            <h1>Spatial</h1>
            <p>Interactive 2D editor toolkit — live examples</p>
            <a href="vanilla/">
              Vanilla JS
              <span>@spatialkit/core + @spatialkit/svg</span>
            </a>
            <a href="react/">
              React
              <span>@spatialkit/core + @spatialkit/react</span>
            </a>
          </body>
          </html>
          EOF

      - name: Create GitHub deployment
        id: create-deployment
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Cloudflare Workers',
            });
            return String(data.id);

      - name: Deploy to Cloudflare
        id: deploy
        run: |
          OUTPUT=$(pnpm dlx wrangler deploy --assets=./pages 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update deployment status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.create-deployment.outputs.result }},
              state: '${{ steps.deploy.outcome }}' === 'success' ? 'success' : 'failure',
              environment_url: '${{ steps.deploy.outputs.url }}',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              auto_inactive: true,
            });
